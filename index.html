<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Greater Than / Less Than Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="text-white h-full min-h-[100dvh] w-screen overflow-hidden flex flex-col select-none items-center justify-between">

    <!-- Portrait Notice for iPad (Prompts child to rotate to landscape) -->
    <div class="rotate-device-overlay">
        <div class="text-7xl mb-6 animate-bounce">📱 🔄</div>
        <h2 class="text-2xl md:text-3xl font-bold text-white mb-2">Please Rotate Your iPad</h2>
        <p class="text-indigo-200 text-lg max-w-sm">This game is designed to be played horizontally in landscape
            orientation.</p>
    </div>

    <!-- Top: Status Bar & Question Header (Separate rows so nothing ever overlaps text) -->
    <header class="w-full max-w-[1040px] flex flex-col items-center justify-center shrink-0 pt-1 pb-1 z-20 px-2">
        <!-- Top Status Bar Row: Hearts on Left, Level Switcher on Right -->
        <div class="w-full flex items-center justify-between mb-1 px-2">
            <!-- Top Left: Lives / Chances (3 Hearts) -->
            <div id="lives-container"
                class="flex items-center gap-1.5 bg-slate-800/90 py-1 px-3 md:py-1.5 md:px-4 rounded-full border border-slate-600 shadow-md text-lg md:text-xl select-none backdrop-blur-sm"
                title="Chances left">
                <span>❤️</span>
                <span>❤️</span>
                <span>❤️</span>
            </div>

            <!-- Top Right: Level Switcher & Settings Gear (50% transparent) -->
            <div class="flex items-center gap-2">
                <div id="level-switcher"
                    class="flex items-center bg-slate-800/80 p-1 rounded-full border border-slate-600/80 shadow-md select-none backdrop-blur-sm gap-1 opacity-50 hover:opacity-100 active:opacity-100 transition-opacity">
                    <button id="lvl-btn-0" onclick="switchLevel(0)"
                        class="px-2.5 py-1 md:px-3.5 md:py-1.5 min-h-[38px] rounded-full text-xs md:text-sm font-extrabold transition-all cursor-pointer bg-indigo-600 text-white shadow-md flex items-center justify-center">
                        Level 0
                    </button>
                    <button id="lvl-btn-05" onclick="switchLevel(0.5)"
                        class="px-2.5 py-1 md:px-3.5 md:py-1.5 min-h-[38px] rounded-full text-xs md:text-sm font-extrabold transition-all cursor-pointer text-slate-300 hover:text-white flex items-center justify-center">
                        Level 0.5
                    </button>
                    <button id="lvl-btn-1" onclick="switchLevel(1)"
                        class="px-2.5 py-1 md:px-3.5 md:py-1.5 min-h-[38px] rounded-full text-xs md:text-sm font-extrabold transition-all cursor-pointer text-slate-300 hover:text-white flex items-center justify-center">
                        Level 1
                    </button>
                    <button id="lvl-btn-2" onclick="switchLevel(2)"
                        class="px-2.5 py-1 md:px-3.5 md:py-1.5 min-h-[38px] rounded-full text-xs md:text-sm font-extrabold transition-all cursor-pointer text-slate-300 hover:text-white flex items-center justify-center">
                        Level 2
                    </button>
                </div>

                <!-- Settings Gear Icon (Active on comparison level) -->
                <button id="settings-btn" onclick="openSettingsModal()" aria-label="Game Settings"
                    class="hidden bg-slate-800/80 p-2 rounded-full border border-slate-600/80 shadow-md text-slate-300 hover:text-white active:scale-95 transition-all items-center justify-center min-w-[38px] min-h-[38px] opacity-60 hover:opacity-100 active:opacity-100 cursor-pointer"
                    title="Game Settings">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Scoreboard: Top, just below lives and level board -->
        <div id="scoreboard" onclick="goToNextRound()"
            class="flex items-center justify-center gap-1.5 md:gap-2 text-base md:text-lg bg-slate-800/90 py-1 px-3.5 md:py-1.5 md:px-5 rounded-full border border-slate-600 shadow-md select-none backdrop-blur-sm cursor-pointer transition-all mb-1"
            title="Tap to continue">
            <!-- Score indicators will be injected here -->
        </div>

        <!-- Question Sentence: Completely unblocked with full 100% width -->
        <h1 id="question-sentence"
            class="hidden text-xl md:text-2xl lg:text-3xl font-extrabold text-gray-100 mb-1 drop-shadow-md text-center px-2 leading-tight w-full">
        </h1>

        <!-- Level 2 Chips: "bigger" and "smaller" waiting to be tapped -->
        <div id="chips-container" class="flex items-center justify-center gap-4 md:gap-6 my-1">
            <!-- Rendered by JS -->
        </div>
    </header>

    <!-- Center: Main Play Area (Optimized for iPad 10.2" Landscape: 1080x810) -->
    <main id="play-area"
        class="w-full max-w-[1040px] flex-1 flex flex-row items-center justify-center gap-4 md:gap-6 px-4 my-auto relative min-h-0">

        <!-- Left Side: Big Box 1 + Small Box 1 Below -->
        <div id="left-column" class="flex-1 flex flex-col h-full max-h-[460px] min-h-[300px] relative justify-center">
            <!-- Big Box 1 -->
            <div id="left-container"
                class="relative flex-1 w-full game-board bg-slate-800 rounded-3xl overflow-hidden border-4 border-slate-600 flex items-center justify-center">
                <!-- Content generated by JS -->
            </div>
            <!-- Small Box 1 (Level 1 only): below Big Box 1, aligned right towards center buttons -->
            <div id="small-box-left"
                class="hidden self-end mt-1.5 md:mt-2 px-4 py-1 md:px-5 md:py-1.5 min-w-[76px] md:min-w-[88px] h-11 md:h-12 bg-slate-800/95 rounded-2xl border-4 border-indigo-400/90 shadow-[0_4px_16px_rgba(0,0,0,0.4),0_0_15px_rgba(99,102,241,0.3)] flex items-center justify-center text-2xl md:text-3xl font-black text-indigo-100 select-none z-10 transition-all">
                <!-- Count injected by JS -->
            </div>
        </div>

        <!-- Middle Column: Handwriting Recognition Canvas (Level 0.5 & Level 1) & Center Drop Slot (Level 0 greater-lesser mode) -->
        <div id="center-col"
            class="hidden flex-col items-center justify-end z-20 shrink-0 self-end mb-0.5">
            <!-- Level 0.5 Prompt Container: Presented with "greater than", "lesser than", or "equal to" -->
            <div id="level05-prompt-container" class="hidden flex-col items-center justify-center mb-3 text-center select-none w-full">
                <div id="level05-prompt-text" class="text-2xl md:text-4xl lg:text-5xl font-black text-amber-300 drop-shadow-[0_4px_16px_rgba(245,158,11,0.4)] px-7 py-3 rounded-2xl bg-slate-800/95 border-2 border-amber-400/60 shadow-lg transition-all flex items-center justify-center text-center">
                    <!-- Injected by JS: "greater than", "lesser than", or "equal to" -->
                </div>
            </div>

            <!-- Canvas Action Bar: Clear & Submit Buttons (Level 0.5 & Level 1) -->
            <div id="canvas-action-bar" class="flex items-center justify-center gap-2.5 md:gap-3 mb-2.5 md:mb-3 select-none">
                <button id="btn-clear-canvas" type="button" aria-label="Clear drawing"
                    class="px-3.5 py-1.5 md:px-4 md:py-1.5 bg-slate-800/90 hover:bg-slate-700 active:bg-slate-900 active:scale-95 text-indigo-200 hover:text-white text-xs md:text-sm font-extrabold rounded-full border border-indigo-400/50 shadow-sm transition-all flex items-center gap-1.5 cursor-pointer select-none">
                    <span>⌫</span> Clear
                </button>
                <button id="btn-submit-canvas" type="button" aria-label="Submit drawing"
                    class="px-4 py-1.5 md:px-5 md:py-1.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 active:scale-95 text-white text-xs md:text-sm font-black rounded-full border border-emerald-400/70 shadow-[0_2px_12px_rgba(16,185,129,0.35)] transition-all flex items-center gap-1.5 cursor-pointer select-none">
                    <span>✓</span> Submit
                </button>
            </div>
            <!-- Canvas Writing Card (Level 0.5 & Level 1) -->
            <div id="canvas-card"
                class="relative w-44 h-32 md:w-48 md:h-36 bg-slate-800/95 rounded-2xl border-4 border-indigo-400/90 shadow-[0_4px_20px_rgba(0,0,0,0.5),0_0_15px_rgba(99,102,241,0.3)] overflow-hidden flex items-center justify-center transition-all">
                <!-- 6 Guide Dots: Blue endpoints and Orange center dots on either side (70% transparency) -->
                <div id="canvas-guide-dots" class="absolute inset-0 pointer-events-none select-none z-0">
                    <span class="guide-dot dot-tl" aria-hidden="true"></span>
                    <span class="guide-dot dot-ml dot-orange" aria-hidden="true"></span>
                    <span class="guide-dot dot-bl" aria-hidden="true"></span>
                    <span class="guide-dot dot-tr" aria-hidden="true"></span>
                    <span class="guide-dot dot-mr dot-orange" aria-hidden="true"></span>
                    <span class="guide-dot dot-br" aria-hidden="true"></span>
                </div>
                <canvas id="handwriting-canvas" class="relative z-10 w-full h-full cursor-crosshair" style="touch-action: none;"></canvas>
            </div>
            <!-- Center Drop Slot (Level 0 Greater-Lesser Mode: between the 2 big boxes) -->
            <div id="level0-center-slot" class="hidden level0-center-drop-slot">
                <span class="text-xs md:text-sm font-extrabold text-indigo-300/80 pointer-events-none select-none text-center px-2">Drop Symbol Here</span>
            </div>
        </div>

        <!-- Right Side: Big Box 2 + Small Box 2 Below -->
        <div id="right-column" class="flex-1 flex flex-col h-full max-h-[460px] min-h-[300px] relative justify-center">
            <!-- Big Box 2 -->
            <div id="right-container"
                class="relative flex-1 w-full game-board bg-slate-800 rounded-3xl overflow-hidden border-4 border-slate-600 flex items-center justify-center">
                <!-- Content generated by JS -->
            </div>
            <!-- Small Box 2 (Level 1 only): below Big Box 2, aligned left towards center buttons -->
            <div id="small-box-right"
                class="hidden self-start mt-1.5 md:mt-2 px-4 py-1 md:px-5 md:py-1.5 min-w-[76px] md:min-w-[88px] h-11 md:h-12 bg-slate-800/95 rounded-2xl border-4 border-indigo-400/90 shadow-[0_4px_16px_rgba(0,0,0,0.4),0_0_15px_rgba(99,102,241,0.3)] flex items-center justify-center text-2xl md:text-3xl font-black text-indigo-100 select-none z-10 transition-all">
                <!-- Count injected by JS -->
            </div>
        </div>
    </main>

    <!-- Bottom spacer for clean margins on iPad -->
    <div class="w-full h-2 shrink-0"></div>

    <!-- Overlay Next Button (floats in lower center above everything so other elements never move) -->
    <button id="next-btn" onclick="goToNextRound()"
        class="hidden px-8 py-2.5 md:px-11 md:py-3 rounded-full text-lg md:text-xl font-black text-white bg-gradient-to-r from-emerald-500 via-indigo-500 to-purple-600 hover:from-emerald-400 hover:to-purple-500 border-2 border-indigo-300 shadow-[0_0_35px_rgba(99,102,241,0.75),0_8px_25px_rgba(0,0,0,0.6)] cursor-pointer select-none items-center justify-center whitespace-nowrap">
        Next ➡️
    </button>

    <!-- Settings Modal (Configuration) -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-slate-700 rounded-3xl p-5 md:p-6 shadow-[0_0_50px_rgba(0,0,0,0.85)] max-w-md w-full text-white animate-popIn">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">⚙️</span>
                    <h3 id="settings-title" class="text-xl font-black text-white">Game Settings</h3>
                </div>
                <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-lg font-bold transition-all cursor-pointer">✕</button>
            </div>

            <!-- Level 0 Settings Content: Comparison Mode -->
            <div id="settings-content-level0" class="hidden">
                <div class="mb-4">
                    <label class="block text-xs font-black uppercase tracking-wider text-indigo-300 mb-2">Comparison Mode</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="opt-l0-big-small" onclick="selectLevel0ModeSetting('big-small')" class="setting-pill flex flex-col items-center justify-center py-3 px-3 rounded-2xl border-2 transition-all cursor-pointer">
                            <span class="text-base font-black">Big &amp; Small</span>
                            <span class="text-[11px] text-indigo-200/80 font-medium mt-1">Word Chips (Default)</span>
                        </button>
                        <button id="opt-l0-greater-lesser" onclick="selectLevel0ModeSetting('greater-lesser')" class="setting-pill flex flex-col items-center justify-center py-3 px-3 rounded-2xl border-2 transition-all cursor-pointer">
                            <span class="text-base font-black">Greater &amp; Lesser</span>
                            <span class="text-[11px] text-indigo-200/80 font-medium mt-1">&gt; and &lt; Sign Chips</span>
                        </button>
                    </div>
                </div>

                <!-- Dynamic Hint Box for Level 0 -->
                <div id="settings-hint-level0" class="p-3 rounded-2xl bg-slate-800/80 border border-slate-700/80 text-xs text-indigo-200 mb-5 leading-relaxed">
                    <!-- Injected dynamically -->
                </div>

                <!-- Action Buttons for Level 0 -->
                <div class="flex gap-2.5">
                    <button onclick="closeSettingsModal()" class="flex-1 min-h-[46px] py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold text-sm transition-all cursor-pointer">Cancel</button>
                    <button onclick="saveAndApplyLevel0Settings()" class="flex-1 min-h-[46px] py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-emerald-600 hover:from-indigo-500 hover:to-emerald-500 active:scale-95 text-white font-extrabold text-sm shadow-lg transition-all cursor-pointer">Save &amp; Play 🎮</button>
                </div>
            </div>

            <!-- Level 1 Settings Content: Digits & Difficulty -->
            <div id="settings-content-level1">
                <!-- Option 1: Digits -->
                <div class="mb-4">
                    <label class="block text-xs font-black uppercase tracking-wider text-indigo-300 mb-2">Number of Digits</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button id="opt-digit-1" onclick="selectDigitSetting(1)" class="setting-pill flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border-2 transition-all cursor-pointer">
                            <span class="text-base font-black">1 Digit</span>
                            <span class="text-[10px] text-indigo-200/80 font-medium mt-0.5">Unit Cubes 🧊</span>
                        </button>
                        <button id="opt-digit-2" onclick="selectDigitSetting(2)" class="setting-pill flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border-2 transition-all cursor-pointer">
                            <span class="text-base font-black">2 Digits</span>
                            <span class="text-[10px] text-indigo-200/80 font-medium mt-0.5">Numbers Only 🔢</span>
                        </button>
                        <button id="opt-digit-3" onclick="selectDigitSetting(3)" class="setting-pill flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border-2 transition-all cursor-pointer">
                            <span class="text-base font-black">3 Digits</span>
                            <span class="text-[10px] text-indigo-200/80 font-medium mt-0.5">Numbers Only 💯</span>
                        </button>
                    </div>
                </div>

                <!-- Option 2: Difficulty Mode -->
                <div class="mb-4">
                    <label class="block text-xs font-black uppercase tracking-wider text-indigo-300 mb-2">Difficulty Mode</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button id="opt-diff-easy" onclick="selectDifficultySetting('easy')" class="setting-pill flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border-2 transition-all cursor-pointer">
                            <span class="text-base font-black text-emerald-400">Easy</span>
                            <span class="text-[10px] text-slate-300 font-medium mt-0.5">Starter</span>
                        </button>
                        <button id="opt-diff-medium" onclick="selectDifficultySetting('medium')" class="setting-pill flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border-2 transition-all cursor-pointer">
                            <span class="text-base font-black text-amber-400">Medium</span>
                            <span class="text-[10px] text-slate-300 font-medium mt-0.5">Tens Place</span>
                        </button>
                        <button id="opt-diff-hard" onclick="selectDifficultySetting('hard')" class="setting-pill flex flex-col items-center justify-center py-2.5 px-2 rounded-2xl border-2 transition-all cursor-pointer">
                            <span class="text-base font-black text-rose-400">Hard</span>
                            <span class="text-[10px] text-slate-300 font-medium mt-0.5">Ones Place</span>
                        </button>
                    </div>
                </div>

                <!-- Dynamic Hint / Explanation Box -->
                <div id="settings-hint" class="p-3 rounded-2xl bg-slate-800/80 border border-slate-700/80 text-xs text-indigo-200 mb-5 leading-relaxed">
                    <!-- Injected dynamically -->
                </div>

                <!-- Action Buttons for Level 1 -->
                <div class="flex gap-2.5">
                    <button onclick="closeSettingsModal()" class="flex-1 min-h-[46px] py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold text-sm transition-all cursor-pointer">Cancel</button>
                    <button onclick="saveAndApplySettings()" class="flex-1 min-h-[46px] py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-emerald-600 hover:from-indigo-500 hover:to-emerald-500 active:scale-95 text-white font-extrabold text-sm shadow-lg transition-all cursor-pointer">Save &amp; Play 🎮</button>
                </div>
            </div>
        </div>
    </div>

    <script src="recognizer.js"></script>
    <script src="game.js"></script>
</body>

</html>
