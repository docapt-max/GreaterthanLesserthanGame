<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Greater Than / Less Than Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-white h-full min-h-[100dvh] w-screen overflow-hidden flex flex-col select-none items-center justify-between">

    <!-- Portrait Notice for iPad (Prompts child to rotate to landscape) -->
    <div class="rotate-device-overlay">
        <div class="text-7xl mb-6 animate-bounce">📱 🔄</div>
        <h2 class="text-2xl md:text-3xl font-bold text-white mb-2">Please Rotate Your iPad</h2>
        <p class="text-indigo-200 text-lg max-w-sm">This game is designed to be played horizontally in landscape orientation.</p>
    </div>

    <!-- Top: Scoreboard & Header -->
    <header class="w-full flex flex-col items-center justify-center shrink-0 pt-2 pb-1">
        <h1 class="text-2xl md:text-3xl lg:text-4xl font-extrabold text-gray-100 mb-2 drop-shadow-md">
            Which side has more?
        </h1>
        <div id="scoreboard" class="flex gap-2 text-xl md:text-2xl bg-slate-800/90 py-1.5 px-5 rounded-full border border-slate-600 shadow-lg">
            <!-- Score indicators will be injected here -->
        </div>
    </header>

    <!-- Center: Main Play Area (Optimized for iPad 10.2" Landscape: 1080x810) -->
    <main class="w-full max-w-[1040px] flex-1 flex flex-row items-center justify-center gap-4 md:gap-6 px-4 my-auto relative min-h-0">
        
        <!-- Left Column: Dots Board -->
        <div id="left-container" class="relative h-full max-h-[500px] min-h-[360px] game-board flex-1 bg-slate-800 rounded-3xl overflow-hidden border-4 border-slate-600">
            <!-- Dots generated by JS -->
        </div>

        <!-- Middle Column: Action Buttons / End Game -->
        <div id="center-col" class="w-28 md:w-36 lg:w-40 flex flex-col justify-center items-center gap-3 md:gap-4 z-20 shrink-0 relative">
            <button id="btn-less" aria-label="Lesser Than (<)" class="w-24 h-32 md:w-32 md:h-40 lg:w-36 lg:h-44 bg-white hover:bg-slate-50 active:bg-slate-100 active:scale-95 transition-all shadow-[0_8px_25px_rgba(0,0,0,0.4),0_0_20px_rgba(99,102,241,0.4)] hover:shadow-[0_10px_30px_rgba(0,0,0,0.5),0_0_25px_rgba(99,102,241,0.6)] border-4 border-indigo-400 hover:border-indigo-300 rounded-2xl md:rounded-3xl p-1.5 md:p-2 flex items-center justify-center cursor-pointer select-none overflow-hidden" onclick="handleGuess('<')">
                <img src="media/LesserThanSign.webp" alt="Lesser Than (<)" class="w-full h-full object-contain pointer-events-none select-none rounded-xl" draggable="false">
            </button>
            <div id="or-text" class="text-indigo-200 font-extrabold tracking-widest text-xs md:text-sm uppercase select-none bg-slate-800/90 px-3 py-1 rounded-full border border-indigo-500/40 shadow-sm">OR</div>
            <button id="btn-greater" aria-label="Greater Than (>)" class="w-24 h-32 md:w-32 md:h-40 lg:w-36 lg:h-44 bg-white hover:bg-slate-50 active:bg-slate-100 active:scale-95 transition-all shadow-[0_8px_25px_rgba(0,0,0,0.4),0_0_20px_rgba(99,102,241,0.4)] hover:shadow-[0_10px_30px_rgba(0,0,0,0.5),0_0_25px_rgba(99,102,241,0.6)] border-4 border-indigo-400 hover:border-indigo-300 rounded-2xl md:rounded-3xl p-1.5 md:p-2 flex items-center justify-center cursor-pointer select-none overflow-hidden" onclick="handleGuess('>')">
                <img src="media/GreaterThanSign.webp" alt="Greater Than (>)" class="w-full h-full object-contain pointer-events-none select-none rounded-xl" draggable="false">
            </button>
        </div>

        <!-- Right Column: Dots Board -->
        <div id="right-container" class="relative h-full max-h-[500px] min-h-[360px] game-board flex-1 bg-slate-800 rounded-3xl overflow-hidden border-4 border-slate-600">
            <!-- Dots generated by JS -->
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
