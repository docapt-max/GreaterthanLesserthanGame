<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Greater Than / Less Than Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="text-white h-full min-h-[100dvh] w-screen overflow-hidden flex flex-col select-none items-center justify-between">

    <!-- Portrait Notice for iPad (Prompts child to rotate to landscape) -->
    <div class="rotate-device-overlay">
        <div class="text-7xl mb-6 animate-bounce">📱 🔄</div>
        <h2 class="text-2xl md:text-3xl font-bold text-white mb-2">Please Rotate Your iPad</h2>
        <p class="text-indigo-200 text-lg max-w-sm">This game is designed to be played horizontally in landscape
            orientation.</p>
    </div>

    <!-- Top: Status Bar & Question Header (Separate rows so nothing ever overlaps text) -->
    <header class="w-full max-w-[1040px] flex flex-col items-center justify-center shrink-0 pt-1 pb-1 z-20 px-2">
        <!-- Top Status Bar Row: Hearts on Left, Level Switcher on Right -->
        <div class="w-full flex items-center justify-between mb-1.5 px-2">
            <!-- Top Left: Lives / Chances (3 Hearts) -->
            <div id="lives-container"
                class="flex items-center gap-1.5 bg-slate-800/90 py-1 px-3 md:py-1.5 md:px-4 rounded-full border border-slate-600 shadow-md text-lg md:text-xl select-none backdrop-blur-sm"
                title="Chances left">
                <span>❤️</span>
                <span>❤️</span>
                <span>❤️</span>
            </div>

            <!-- Top Right: Level Switcher -->
            <div id="level-switcher"
                class="flex items-center bg-slate-800/90 p-1 rounded-full border border-slate-600 shadow-md select-none backdrop-blur-sm gap-1">
                <button id="lvl-btn-1" onclick="switchLevel(1)"
                    class="px-3.5 py-1 md:px-4 md:py-1.5 min-h-[38px] rounded-full text-xs md:text-sm font-extrabold transition-all cursor-pointer bg-indigo-600 text-white shadow-md flex items-center justify-center">
                    Level 1
                </button>
                <button id="lvl-btn-2" onclick="switchLevel(2)"
                    class="px-3.5 py-1 md:px-4 md:py-1.5 min-h-[38px] rounded-full text-xs md:text-sm font-extrabold transition-all cursor-pointer text-slate-300 hover:text-white flex items-center justify-center">
                    Level 2
                </button>
            </div>
        </div>

        <!-- Question Sentence: Completely unblocked with full 100% width -->
        <h1 id="question-sentence"
            class="text-xl md:text-2xl lg:text-3xl font-extrabold text-gray-100 mb-1 drop-shadow-md text-center px-2 leading-tight w-full">
            The green circle is ______ than the red circle.
        </h1>

        <!-- Level 1 Chips: "bigger" and "smaller" waiting to be tapped -->
        <div id="chips-container" class="flex items-center justify-center gap-4 md:gap-6 my-1">
            <!-- Rendered by JS -->
        </div>
    </header>

    <!-- Center: Main Play Area (Optimized for iPad 10.2" Landscape: 1080x810) -->
    <main id="play-area"
        class="w-full max-w-[1040px] flex-1 flex flex-row items-center justify-center gap-4 md:gap-6 px-4 my-auto relative min-h-0">

        <!-- Left Column: Geometric Shape (Level 1) or Dots Board (Level 2) -->
        <div id="left-container"
            class="relative h-full max-h-[480px] min-h-[320px] game-board flex-1 bg-slate-800 rounded-3xl overflow-hidden border-4 border-slate-600 flex items-center justify-center">
            <!-- Content generated by JS -->
        </div>

        <!-- Middle Column: Action Buttons (Level 2 only) -->
        <div id="center-col"
            class="w-28 md:w-36 lg:w-40 flex flex-col justify-center items-center gap-3 md:gap-4 z-20 shrink-0 relative">
            <button id="btn-less" aria-label="Lesser Than (<)"
                class="w-24 h-32 md:w-32 md:h-40 lg:w-36 lg:h-44 bg-white hover:bg-slate-50 active:bg-slate-100 active:scale-95 transition-all shadow-[0_8px_25px_rgba(0,0,0,0.4),0_0_20px_rgba(99,102,241,0.4)] hover:shadow-[0_10px_30px_rgba(0,0,0,0.5),0_0_25px_rgba(99,102,241,0.6)] border-4 border-indigo-400 hover:border-indigo-300 rounded-2xl md:rounded-3xl p-1.5 md:p-2 flex items-center justify-center cursor-pointer select-none overflow-hidden"
                onclick="handleLevel2Guess('<')">
                <img src="media/LesserThanSign.webp" alt="Lesser Than (<)"
                    class="w-full h-full object-contain pointer-events-none select-none rounded-xl" draggable="false">
            </button>
            <div id="or-text"
                class="text-indigo-200 font-extrabold tracking-widest text-xs md:text-sm uppercase select-none bg-slate-800/90 px-3 py-1 rounded-full border border-indigo-500/40 shadow-sm">
                OR</div>
            <button id="btn-greater" aria-label="Greater Than (>)"
                class="w-24 h-32 md:w-32 md:h-40 lg:w-36 lg:h-44 bg-white hover:bg-slate-50 active:bg-slate-100 active:scale-95 transition-all shadow-[0_8px_25px_rgba(0,0,0,0.4),0_0_20px_rgba(99,102,241,0.4)] hover:shadow-[0_10px_30px_rgba(0,0,0,0.5),0_0_25px_rgba(99,102,241,0.6)] border-4 border-indigo-400 hover:border-indigo-300 rounded-2xl md:rounded-3xl p-1.5 md:p-2 flex items-center justify-center cursor-pointer select-none overflow-hidden"
                onclick="handleLevel2Guess('>')">
                <img src="media/GreaterThanSign.webp" alt="Greater Than (>)"
                    class="w-full h-full object-contain pointer-events-none select-none rounded-xl" draggable="false">
            </button>
        </div>

        <!-- Right Column: Geometric Shape (Level 1) or Dots Board (Level 2) -->
        <div id="right-container"
            class="relative h-full max-h-[480px] min-h-[320px] game-board flex-1 bg-slate-800 rounded-3xl overflow-hidden border-4 border-slate-600 flex items-center justify-center">
            <!-- Content generated by JS -->
        </div>
    </main>

    <!-- Bottom: Scoreboard / Score bar (fixed at bottom across all levels) -->
    <footer class="w-full flex items-center justify-center shrink-0 pt-1 pb-3 md:pb-4 z-20">
        <!-- Scoreboard: can also be tapped to advance to next attempt -->
        <div id="scoreboard" onclick="goToNextRound()"
            class="flex gap-2 text-xl md:text-2xl bg-slate-800/90 py-1.5 px-5 rounded-full border border-slate-600 shadow-lg select-none backdrop-blur-sm cursor-pointer transition-all"
            title="Tap to continue">
            <!-- Score indicators will be injected here -->
        </div>
    </footer>

    <!-- Overlay Next Button (floats in lower center above everything so other elements never move) -->
    <button id="next-btn" onclick="goToNextRound()"
        class="hidden px-8 py-2.5 md:px-11 md:py-3 rounded-full text-lg md:text-xl font-black text-white bg-gradient-to-r from-emerald-500 via-indigo-500 to-purple-600 hover:from-emerald-400 hover:to-purple-500 border-2 border-indigo-300 shadow-[0_0_35px_rgba(99,102,241,0.75),0_8px_25px_rgba(0,0,0,0.6)] cursor-pointer select-none items-center justify-center whitespace-nowrap">
        Next ➡️
    </button>

    <script src="game.js"></script>
</body>

</html>
